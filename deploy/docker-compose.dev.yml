# Local development MongoDB only. The API runs on the host with `npm run dev` in server/.
# Start from the repo root: docker compose -f deploy/docker-compose.dev.yml up -d

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Bound to localhost only.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-dev-data:/data/db

volumes:
  mongo-dev-data:
